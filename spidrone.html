<!DOCTYPE html>
<html lang="fr">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>SPIDRONE</title>

  <link rel="icon" type="image/png" href="images/0.Home/FAVICON.png">

  <link rel="stylesheet" href="css/style.css">
  <link rel="stylesheet" href="css/spidrone.css">
</head>

<body class="spidrone-page">


  <!-- =========================
  TOP BAR
  ========================== -->

  <div class="spidrone-topbar">

    <img
      src="images/Spidrone/BAR.png"
      alt="Navigation"
      class="spidrone-topbar-image"
      draggable="false"
    >

    <a
      class="spidrone-nav-home"
      href="home.html"
      aria-label="Home">
    </a>

    <a
      class="spidrone-nav-projects"
      href="projects.html"
      aria-label="Projects">
    </a>

    <a
      class="spidrone-nav-about"
      href="about.html"
      aria-label="About">
    </a>

  </div>

  SPIDRONE CONTAINER
  ========================== -->

  <main class="spidrone-container">



    <!-- ==================================================
    SPIDRONE 01
    1440 x 5000
    =================================================== -->

    <section class="spidrone-panel spidrone-panel-01">

      <img
        src="images/Spidrone/spidrone-01.jpg"
        alt="SPIDRONE project page 01"
        class="spidrone-image"
        draggable="false"
      >


      <!-- VIDEO 1 -->

      <video
        class="spidrone-video spidrone-video-1"
        autoplay
        muted
        loop
        playsinline
      >
        <source src="images/Spidrone/video-1.mp4" type="video/mp4">
      </video>



      <!-- NUMBER 01 -->

      <div id="spidrone-anchor-01" class="spidrone-anchor spidrone-anchor-01"></div>

      <div class="spidrone-number spidrone-number-01">
        <img
          src="images/Spidrone/Number 01.png"
          alt="01"
          class="spidrone-number-image"
          draggable="false"
        >

        <a
          href="#spidrone-anchor-02"
          class="spidrone-number-down"
          aria-label="Next section">
        </a>

        <span class="spidrone-number-up spidrone-number-disabled"></span>
      </div>
