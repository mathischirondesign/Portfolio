<!DOCTYPE html>
<html lang="fr">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>SKETCH</title>

  <link rel="icon" type="image/png" href="images/0.Home/FAVICON.png">

  <link rel="stylesheet" href="css/style.css">
  <link rel="stylesheet" href="css/sketch.css">
</head>

<body class="sketch-page">


  <!-- =========================
  TOP BAR
  ========================== -->

  <div class="sketch-topbar">

    <img
      src="images/Sketch/BAR.png"
      alt="Navigation"
      class="sketch-topbar-image"
      draggable="false"
    >

    <a
      class="sketch-nav-home"
      href="home.html"
      aria-label="Home">
    </a>

    <a
      class="sketch-nav-projects"
      href="projects.html"
      aria-label="Projects">
    </a>

    <a
      class="sketch-nav-about"
      href="about.html"
      aria-label="About">
    </a>

  </div>



  <!-- =========================
  SKETCH CONTAINER
  ========================== -->

  <main class="sketch-container">



    <!-- ==================================================
    SKETCH 01
    1440 x 5000
    =================================================== -->

    <section class="sketch-panel sketch-panel-01">

      <img
        src="images/Sketch/sketch-01.jpg"
        alt="SKETCH project page 01"
        class="sketch-image"
        draggable="false"
      >



      <!-- NUMBER 01 -->

      <div
        id="sketch-anchor-01"
        class="sketch-anchor sketch-anchor-01">
      </div>

      <div class="sketch-number sketch-number-01">

        <img
          src="images/Sketch/Number 01.png"
          alt="01"
          class="sketch-number-image"
          draggable="false"
        >

        <a
          href="#sketch-anchor-02"
          class="sketch-number-down"
          aria-label="Next section">
        </a>

        <span
          class="sketch-number-up sketch-number-disabled">
        </span>

      </div>



      <!-- NUMBER 02 -->

      <div
        id="sketch-anchor-02"
        class="sketch-anchor sketch-anchor-02">
      </div>

      <div class="sketch-number sketch-number-02">

        <img
          src="images/Sketch/Number 02.png"
          alt="02"
          class="sketch-number-image"
          draggable="false"
        >

        <a
          href="#sketch-anchor-03"
          class="sketch-number-down"
          aria-label="Next section">
        </a>

        <a
          href="#sketch-anchor-01"
          class="sketch-number-up"
          aria-label="Previous section">
        </a>

      </div>



      <!-- NUMBER 03 -->

      <div
        id="sketch-anchor-03"
        class="sketch-anchor sketch-anchor-03">
      </div>

      <div class="sketch-number sketch-number-03">

        <img
          src="images/Sketch/Number 03.png"
          alt="03"
          class="sketch-number-image"
          draggable="false"
        >

        <a
          href="#sketch-anchor-04"
          class="sketch-number-down"
          aria-label="Next section">
        </a>

        <a
          href="#sketch-anchor-02"
          class="sketch-number-up"
          aria-label="Previous section">
        </a>

      </div>



      <!-- NUMBER 04 -->

      <div
        id="sketch-anchor-04"
        class="sketch-anchor sketch-anchor-04">
      </div>

      <div class="sketch-number sketch-number-04">

        <img
          src="images/Sketch/Number 04.png"
          alt="04"
          class="sketch-number-image"
          draggable="false"
        >

        <a
          href="#sketch-anchor-05"
          class="sketch-number-down"
          aria-label="Next section">
        </a>

        <a
          href="#sketch-anchor-03"
          class="sketch-number-up"
          aria-label="Previous section">
        </a>

      </div>

    </section>





    <!-- ==================================================
    SKETCH 02
    1440 x 4200
    =================================================== -->

    <section class="sketch-panel sketch-panel-02">

      <img
        src="images/Sketch/sketch-02.jpg"
        alt="SKETCH project page 02"
        class="sketch-image"
        draggable="false"
      >



      <!-- NUMBER 05 -->

      <div
        id="sketch-anchor-05"
        class="sketch-anchor sketch-anchor-05">
      </div>

      <div class="sketch-number sketch-number-05">

        <img
          src="images/Sketch/Number 05.png"
          alt="05"
          class="sketch-number-image"
          draggable="false"
        >

        <a
          href="#sketch-anchor-06"
          class="sketch-number-down"
          aria-label="Next section">
        </a>

        <a
          href="#sketch-anchor-04"
          class="sketch-number-up"
          aria-label="Previous section">
        </a>

      </div>



      <!-- NUMBER 06 -->

      <div
        id="sketch-anchor-06"
        class="sketch-anchor sketch-anchor-06">
      </div>

      <div class="sketch-number sketch-number-06">

        <img
          src="images/Sketch/Number 06.png"
          alt="06"
          class="sketch-number-image"
          draggable="false"
        >

        <span
          class="sketch-number-down sketch-number-disabled">
        </span>

        <a
          href="#sketch-anchor-05"
          class="sketch-number-up"
          aria-label="Previous section">
        </a>

      </div>

    </section>


  </main>



  <script>
    document.addEventListener(
      "contextmenu",
      event => event.preventDefault()
    );
  </script>


</body>

</html>
