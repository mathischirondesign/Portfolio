<!DOCTYPE html>
<html lang="fr">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>SPIDRONE</title>
  <link rel="icon" type="image/png" href="images/0.Home/FAVICON.png">
  <link rel="stylesheet" href="style.css">
</head>

<body class="spidrone-page">

  <div class="spidrone-topbar">
    <img
      src="images/03.Spidrone/BAR.png"
      alt="Navigation"
      class="spidrone-topbar-image"
      draggable="false"
    >

    <a class="spidrone-nav-home" href="0.home.html" aria-label="Home"></a>
    <a class="spidrone-nav-projects" href="0.projects.html" aria-label="Projects"></a>
    <a class="spidrone-nav-about" href="0.about.html" aria-label="About"></a>
  </div>

  <div class="spidrone-container">

    <img
      src="images/03.Spidrone/spidrone-01.jpg"
      alt="SPIDRONE Project part 1"
      class="spidrone-image"
      draggable="false"
    >

    <img
      src="images/03.Spidrone/spidrone-02.jpg"
      alt="SPIDRONE Project part 2"
      class="spidrone-image"
      draggable="false"
    >

    <img
      src="images/03.Spidrone/spidrone-03.jpg"
      alt="SPIDRONE Project part 3"
      class="spidrone-image"
      draggable="false"
    >

    <video class="spidrone-video spidrone-video-1" autoplay muted loop playsinline>
      <source src="images/03.Spidrone/video-1.mp4" type="video/mp4">
    </video>

    <video class="spidrone-video spidrone-video-2" autoplay muted loop playsinline>
      <source src="images/03.Spidrone/video-2.mp4" type="video/mp4">
    </video>

  </div>

  <script>
    document.addEventListener('contextmenu', event => event.preventDefault());
  </script>

</body>

</html>
