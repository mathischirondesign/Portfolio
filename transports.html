<!DOCTYPE html>
<html lang="fr">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>TRANSPORTS</title>

  <link rel="icon" type="image/png" href="images/0.Home/FAVICON.png">

  <link rel="stylesheet" href="css/style.css">
  <link rel="stylesheet" href="css/transports.css">
</head>

<body class="transports-page">


  <!-- =========================
  TOP BAR
  ========================== -->

  <div class="transports-topbar">

    <img
      src="images/Transports/BAR.png"
      alt="Navigation"
      class="transports-topbar-image"
      draggable="false"
    >

    <a
      class="transports-nav-home"
      href="home.html"
      aria-label="Home">
    </a>

    <a
      class="transports-nav-projects"
      href="projects.html"
      aria-label="Projects">
    </a>

    <a
      class="transports-nav-about"
      href="about.html"
      aria-label="About">
    </a>

  </div>



  <!-- =========================
  TRANSPORTS CONTAINER
  ========================== -->

  <main class="transports-container">



    <!-- ==================================================
    TRANSPORTS 01
    1440 x 5500
    =================================================== -->

    <section class="transports-panel transports-panel-01">

      <img
        src="images/Transports/transports-01.jpg"
        alt="TRANSPORTS project page 01"
        class="transports-image"
        draggable="false"
      >



      <!-- NUMBER 01 -->

      <div
        id="transports-anchor-01"
        class="transports-anchor transports-anchor-01">
      </div>

      <div class="transports-number transports-number-01">

        <img
          src="images/Transports/Number 01.png"
          alt="01"
          class="transports-number-image"
          draggable="false"
        >

        <a
          href="#transports-anchor-02"
          class="transports-number-down"
          aria-label="Next section">
        </a>

        <span
          class="transports-number-up transports-number-disabled">
        </span>

      </div>



      <!-- NUMBER 02 -->

      <div
        id="transports-anchor-02"
        class="transports-anchor transports-anchor-02">
      </div>

      <div class="transports-number transports-number-02">

        <img
          src="images/Transports/Number 02.png"
          alt="02"
          class="transports-number-image"
          draggable="false"
        >

        <a
          href="#transports-anchor-03"
          class="transports-number-down"
          aria-label="Next section">
        </a>

        <a
          href="#transports-anchor-01"
          class="transports-number-up"
          aria-label="Previous section">
        </a>

      </div>

    </section>





    <!-- ==================================================
    TRANSPORTS 02
    1440 x 6120
    =================================================== -->

    <section class="transports-panel transports-panel-02">

      <img
        src="images/Transports/transports-02.jpg"
        alt="TRANSPORTS project page 02"
        class="transports-image"
        draggable="false"
      >



      <!-- NUMBER 03 -->

      <div
        id="transports-anchor-03"
        class="transports-anchor transports-anchor-03">
      </div>

      <div class="transports-number transports-number-03">

        <img
          src="images/Transports/Number 03.png"
          alt="03"
          class="transports-number-image"
          draggable="false"
        >

        <a
          href="#transports-anchor-04"
          class="transports-number-down"
          aria-label="Next section">
        </a>

        <a
          href="#transports-anchor-02"
          class="transports-number-up"
          aria-label="Previous section">
        </a>

      </div>



      <!-- NUMBER 04 -->

      <div
        id="transports-anchor-04"
        class="transports-anchor transports-anchor-04">
      </div>

      <div class="transports-number transports-number-04">

        <img
          src="images/Transports/Number 04.png"
          alt="04"
          class="transports-number-image"
          draggable="false"
        >

        <a
          href="#transports-anchor-05"
          class="transports-number-down"
          aria-label="Next section">
        </a>

        <a
          href="#transports-anchor-03"
          class="transports-number-up"
          aria-label="Previous section">
        </a>

      </div>



      <!-- NUMBER 05 -->

      <div
        id="transports-anchor-05"
        class="transports-anchor transports-anchor-05">
      </div>

      <div class="transports-number transports-number-05">

        <img
          src="images/Transports/Number 05.png"
          alt="05"
          class="transports-number-image"
          draggable="false"
        >

        <a
          href="#transports-anchor-06"
          class="transports-number-down"
          aria-label="Next section">
        </a>

        <a
          href="#transports-anchor-04"
          class="transports-number-up"
          aria-label="Previous section">
        </a>

      </div>



      <!-- NUMBER 06 -->

      <div
        id="transports-anchor-06"
        class="transports-anchor transports-anchor-06">
      </div>

      <div class="transports-number transports-number-06">

        <img
          src="images/Transports/Number 06.png"
          alt="06"
          class="transports-number-image"
          draggable="false"
        >

        <span
          class="transports-number-down transports-number-disabled">
        </span>

        <a
          href="#transports-anchor-05"
          class="transports-number-up"
          aria-label="Previous section">
        </a>

      </div>

    </section>


  </main>



  <script>
    document.addEventListener(
      "contextmenu",
      event => event.preventDefault()
    );
  </script>


</body>

</html>
