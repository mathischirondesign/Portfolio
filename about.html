<!DOCTYPE html>
<html lang="fr">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>About</title>

  <link rel="icon" type="image/png" href="images/0.Home/FAVICON.png">

  <link rel="stylesheet" href="css/style.css">
  <link rel="stylesheet" href="css/about.css">
</head>

<body class="about-page">

  <!-- =========================
  TOP BAR
  ========================== -->

  <div class="project-topbar">

    <img
      src="images/0.About/BAR.png"
      alt="Navigation"
      class="project-topbar-image"
      draggable="false"
    >

    <a
      class="project-nav-home"
      href="home.html"
      aria-label="Home"
    ></a>

    <a
      class="project-nav-projects"
      href="projects.html"
      aria-label="Projects"
    ></a>

    <a
      class="project-nav-about"
      href="about.html"
      aria-label="About"
    ></a>

  </div>


  <!-- =========================
  ABOUT CONTENT
  ========================== -->

  <main class="about-container">

    <img
      src="images/0.About/ABOUT.jpg"
      alt="About"
      class="about-image"
      draggable="false"
    >

  </main>


  <script>
    document.addEventListener(
      "contextmenu",
      event => event.preventDefault()
    );
  </script>

</body>

</html>
